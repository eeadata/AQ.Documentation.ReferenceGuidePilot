{% extends "!layout.html" %}

{% block sidebartitle %}
<div class="aura-branding">
  <div class="aura-brand-row">
    <a class="aura-eea-link" href="https://www.eea.europa.eu/" aria-label="European Environment Agency">
      <img class="aura-eea-logo" src="{{ pathto('_static/EEA.png', 1) }}" alt="European Environment Agency">
    </a>
    <div class="aura-name">AURA</div>
  </div>

  <nav class="aura-sites" aria-label="AURA websites">
    <a href="https://eeadata.github.io/AQ.Portal/">portal</a>
    <a href="https://eeadata.github.io/AQ.Documentation.ReportingGuide/">reporting guide</a>
    <span class="aura-current" aria-current="page">reference guide</span>
  </nav>
</div>

{% include "searchbox.html" %}
{% endblock %}

{% block menu %}
  {{ super() }}

  <div class="aura-pdf-link">
    <a href="{{ pathto('_static/AQ_eReference_Guide.pdf', 1) }}"
       target="_blank"
       rel="noopener">
      PDF version
    </a>
  </div>
{% endblock %}
